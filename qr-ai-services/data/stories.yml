version: "3.1"

stories:

  - story: Greeting
    steps:
      - intent: greet
      - action: utter_greet

  - story: Ordering Food
    steps:
      - intent: order_food
        entities:
          - dish: dosa
          - quantity: 2
      - action: action_add_to_cart

  - story: Track Order
    steps:
      - intent: track_order
      - action: action_track_order

  - story: Browse Menu
    steps:
      - intent: browse_menu
      - action: action_fetch_menu

  - story: Give Feedback
    steps:
      - intent: give_feedback
      - action: utter_give_feedback
      - intent: feedback_comment
      - slot_was_set:
          - feedback_comment: "The food was great!"
      - intent: feedback_rating
      - slot_was_set:
          - feedback_rating: "5"
      - action: action_submit_feedback

  - story: Recommend Menu
    steps:
      - intent: recommend_menu
      - action: action_recommend_menu

  - story: Search Menu by Name
    steps:
      - intent: search_menu
        entities:
          - dish: paneer
      - action: action_search_menu

  - story: Search Menu by Category
    steps:
      - intent: search_menu
        entities:
          - category: beverage
      - action: action_search_menu

  - story: Cancel Last Item
    steps:
      - intent: cancel_order
      - action: action_remove_last_item

  - story: View Cart
    steps:
      - intent: view_cart
      - action: action_view_cart

  - story: Request Waiter
    steps:
      - intent: request_waiter
      - action: action_request_waiter

  - story: Ask for Bill
    steps:
      - intent: ask_bill
      - action: action_ask_bill

  - story: Unknown Intent
    steps:
      - intent: out_of_scope
      - action: action_llm_fallback