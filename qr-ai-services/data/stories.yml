stories:
  - story: Greeting
    steps:
      - intent: greet
      - action: utter_greet

  - story: Ordering Food
    steps:
      - intent: order_food
      - action: utter_order_food

  - story: Tracking Order
    steps:
      - intent: track_order
      - action: utter_track_order

  - story: Browsing Menu
    steps:
      - intent: browse_menu
      - action: utter_browse_menu

  - story: Giving Feedback
    steps:
      - intent: give_feedback
      - action: utter_give_feedback

  - story: Unknown Intent
    steps:
      - intent: out_of_scope
      - action: utter_unknown

  - story: Customer searches for menu item
    steps:
        - intent: search_menu
          entities:
            - dish: "paneer"
        - action: action_search_menu
        - response: utter_search_menu