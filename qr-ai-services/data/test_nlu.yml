version: "3.1"

nlu:
  - intent: greet
    examples: |
      - hi
      - hello
      - hey
      - namaste
      - good morning

  - intent: order_food
    examples: |
      - I want two dosas
      - Add one idli
      - Place order for three pizzas
      - Get a burger
      - Can I get a paneer roll?

  - intent: track_order
    examples: |
      - Where is my food?
      - Order status
      - Is my order ready?
      - Track my order
      - When will my food arrive?

  - intent: browse_menu
    examples: |
      - Show me the menu
      - What do you have?
      - View menu
      - List dishes
      - What's on offer today?

  - intent: confirm_order
    examples: |
      - Yes
      - Confirm my order
      - Proceed
      - Go ahead
      - Yep

  - intent: cancel_order
    examples: |
      - Cancel this
      - Remove last item
      - Undo
      - Take back
      - Delete that

  - intent: give_feedback
    examples: |
      - Rate my meal
      - Leave feedback
      - How was the service?
      - I want to complain
      - I want to praise

  - intent: recommend_menu
    examples: |
      - Recommend something
      - What's popular?
      - Suggest a dish
      - Best dish here
      - What should I try?

  - intent: out_of_scope
    examples: |
      - What is the weather?
      - Who made this?
      - Explain how it works