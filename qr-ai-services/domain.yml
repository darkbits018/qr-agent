version: "3.1"


intents:
  - greet
  - order_food
  - track_order
  - browse_menu
  - confirm_order
  - cancel_order
  - give_feedback
  - recommend_menu
  - view_cart
  - request_waiter
  - ask_bill
  - modify_order_quantity
  - unknown
  - out_of_scope
  - search_menu        # ← Add this
  - feedback_comment   # ← Add this
  - feedback_rating    # ← If used, should also be added

entities:
  - dish
  - quantity
  - table_id
  - organization_id
  - group_id
  - member_token
  - feedback_rating
  - feedback_comment
  - category
  - dietary_preference
  - available_times
  - order_id
  - special_requests

slots:
  org_id:
    type: text
    mappings:
      - type: from_entity
        entity: organization_id
      - type: custom
        module: utils
        method: get_org_id_from_metadata

  table_id:
    type: text
    mappings:
      - type: from_entity
        entity: table_id
      - type: custom
        module: utils
        method: get_table_id_from_metadata

  group_id:
    type: text
    mappings:
      - type: from_entity
        entity: group_id

  member_token:
    type: text
    mappings:
      - type: from_entity
        entity: member_token

  dish:
    type: text
    mappings:
      - type: from_entity
        entity: dish

  category:
    type: text
    mappings:
      - type: from_entity
        entity: category

  dietary_preference:
    type: text
    mappings:
      - type: from_entity
        entity: dietary_preference

  available_times:
    type: text
    mappings:
      - type: from_entity
        entity: available_times

  quantity:
    type: text
    mappings:
      - type: from_entity
        entity: quantity

  feedback_rating:
    type: text
    mappings:
      - type: from_entity
        entity: feedback_rating

  feedback_comment:
    type: text
    mappings:
      - type: from_entity
        entity: feedback_comment

  order_id:
    type: text
    mappings:
      - type: from_entity
        entity: order_id

  special_requests:
    type: text
    mappings:
      - type: from_entity
        entity: special_requests

  fallback_intent:
    type: bool
    initial_value: false
    influence_conversation: false
    mappings: [ ]

responses:
  utter_greet:
    - text: "Hi! I'm Sam. How can I help?"
    - text: "Welcome again, {name}!"
    - text: "Hello there! QR scanned successfully."

  utter_browse_menu:
    - text: "Fetching menu..."
    - text: "Here’s what we’re serving today"
    - text: "Loading latest menu items..."

  utter_order_food:
    - text: "Added {quantity} {dish}(s). Anything else?"
    - text: "Placed your order for {quantity} {dish}. Want more?"

  utter_track_order:
    - text: "Checking your order status..."
    - text: "Your order is being prepared."
    - text: "It'll be ready soon!"

  utter_recommend_menu:
    - text: "Here are some popular dishes you might enjoy."

  utter_confirm_order:
    - text: "Order confirmed!"
    - text: "Thanks for confirming."

  utter_cancel_order:
    - text: "Last item removed."
    - text: "Item canceled from order."

  utter_give_feedback:
    - text: "How did you rate your experience? Please enter 1–5."
    - text: "Would you like to leave any feedback before you go?"

  utter_unknown:
    - text: "I didn’t understand that. Could you rephrase?"
    - text: "Could you say that differently?"
    - text: "Sorry, I’m still learning. Can you clarify?"

  utter_goodbye:
    - text: "Thanks for ordering! Enjoy your meal."
    - text: "Hope you enjoyed your food!"

  utter_search_menu:
    - text: "Looking up items matching '{dish}'..."
    - text: "Here are some {category} items we have..."
    - text: "I found some items available during {available_times}"
    - text: "Let me check what we have for you..."

  utter_view_cart:
    - text: "Let me fetch your cart..."
    - text: "Here's what you've ordered so far."

  utter_request_waiter:
    - text: "Waiter has been notified."
    - text: "Someone will assist you shortly."

  utter_ask_bill:
    - text: "Getting your bill..."
    - text: "Here’s your total amount due."


actions:
  - action_search_menu
  - action_add_to_cart
  - action_track_order
  - action_view_cart
  - action_request_waiter
  - action_ask_bill
  - action_recommend_menu
  - action_remove_last_item
  - action_llm_fallback
  - action_fetch_menu
  - action_submit_feedback

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true