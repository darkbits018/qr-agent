version: "3.0"

intents:
  - greet
  - order_food
  - track_order
  - browse_menu
  - confirm_order
  - cancel_order
  - give_feedback
  - recommend_menu
  - unknown
  - out_of_scope

entities:
  - dish
  - quantity
  - table_id
  - organization_id
  - group_id
  - member_token
  - feedback_rating
  - feedback_comment
  - category
  - dietary_preference
  - available_times

slots:
  org_id:
    type: text
    mappings:
      - type: from_entity
        entity: organization_id
  table_id:
    type: text
    mappings:
      - type: from_entity
        entity: table_id
  group_id:
    type: text
    mappings:
      - type: from_entity
        entity: group_id
  dish:
    type: text
    mappings:
      - type: from_entity
        entity: dish
  category:
    type: text
    mappings:
      - type: from_entity
        entity: category
  dietary_preference:
    type: text
    mappings:
      - type: from_entity
        entity: dietary_preference
  available_times:
    type: text
    mappings:
      - type: from_entity
        entity: available_times
  quantity:
    type: text
    mappings:
      - type: from_entity
        entity: quantity
  feedback_rating:
    type: text
    mappings:
      - type: from_entity
        entity: feedback_rating
  feedback_comment:
    type: text
    mappings:
      - type: from_entity
        entity: feedback_comment

responses:
  utter_greet:
    - text: "Hi! I'm Sam. How can I help?"
    - text: "Welcome again, {name}!"
    - text: "Hello there! QR scanned successfully."

  utter_browse_menu:
    - text: "Fetching menu..."
    - text: "Here’s what we’re serving today"
    - text: "Loading latest menu items..."

  utter_order_food:
    - text: "Added {quantity} {dish}(s). Anything else?"
    - text: "Placed your order for {quantity} {dish}. Want more?"

  utter_track_order:
    - text: "Checking your order status..."
    - text: "Your order is being prepared."
    - text: "It'll be ready soon!"

  utter_recommend_menu:
    - text: "Here are some popular dishes you might enjoy."

  utter_confirm_order:
    - text: "Order confirmed!"
    - text: "Thanks for confirming."

  utter_cancel_order:
    - text: "Last item removed."
    - text: "Item canceled from order."

  utter_give_feedback:
    - text: "How did you rate your experience? Please enter 1–5."
    - text: "Would you like to leave any feedback before you go?"

  utter_unknown:
    - text: "I didn’t understand that. Could you rephrase?"
    - text: "Could you say that differently?"
    - text: "Sorry, I’m still learning. Can you clarify?"

  utter_goodbye:
    - text: "Thanks for ordering! Enjoy your meal."
    - text: "Hope you enjoyed your food!"

  responses:
    utter_search_menu:
      - text: "Looking up items matching '{dish}'..."
      - text: "Here are some {category} items we have..."
      - text: "I found some items available during {available_times}"
      - text: "Let me check what we have for you..."

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true